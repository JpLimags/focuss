[project]
name = "focuss"
version = "0.1.0"
description = "Plataforma de estudo com repetição espaçada (SM-2) para pessoas com TDAH"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pypdf>=4.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "bcrypt",
    "itsdangerous",
    "sentence-transformers",
    "faiss-cpu",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# O TestClient do Starlette avisa sobre o httpx; não afeta o código do projeto.
filterwarnings = ["ignore:Using `httpx` with"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
