[project]
name = "focuss"
version = "0.1.0"
description = "Plataforma de estudo com repetição espaçada (SM-2) para pessoas com TDAH"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pypdf>=4.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "bcrypt",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]